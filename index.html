<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noter</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Quill.js for Rich Text Editing -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #37352f; /* Notion-like text color */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Notion-like scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d3d1cb;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aeaca6;
        }

        /* Quill Editor overrides for Notion feel */
        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid #e5e7eb !important;
            padding: 8px 0 !important;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 5;
        }
        .ql-container.ql-snow {
            border: none !important;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
        }
        .ql-editor {
            padding: 0 !important;
            min-height: 50vh;
        }
        
        /* Utility classes */
        @media (hover: hover) {
            .item-hover .item-actions {
                opacity: 0;
            }
            .item-hover:hover .item-actions {
                opacity: 1;
            }
        }
        
        .modal-backdrop {
            background-color: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(2px);
        }

        /* Sidebar: skjult som standard på mobil/touch (selv i 'Desktop-websted' tilstand) */
        #sidebar {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 16rem;
            max-width: 78vw;
            z-index: 40;
        }
        #sidebar.sidebar-open {
            display: flex !important;
        }
        @media (min-width: 768px) and (pointer: fine) {
            #sidebar {
                display: flex;
                position: relative;
                max-width: none;
            }
            #sidebar.sidebar-closed-desktop {
                display: none !important;
            }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex bg-white">

    <!-- Authentication Overlay -->
    <div id="auth-screen" class="fixed inset-0 bg-[#f7f7f5] z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-lg shadow-sm border border-gray-200 w-96 max-w-full">
            <div class="text-center mb-6">
                <i class="fa-solid fa-note-sticky text-3xl text-gray-700 mb-2"></i>
                <h2 class="text-2xl font-bold">Noter</h2>
                <p class="text-sm text-gray-500 mt-1">Log ind for at se dine noter</p>
            </div>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-200 text-base" placeholder="dig@eksempel.dk">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Adgangskode</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-200 text-base" placeholder="••••••••">
                </div>
                <div id="auth-error" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded border border-red-200 break-words leading-relaxed">Fejl: Kunne ikke logge ind.</div>
                
                <button type="submit" id="login-btn" class="w-full bg-gray-800 text-white py-2.5 rounded-md hover:bg-gray-700 transition font-medium">Log ind</button>
                <button type="button" id="register-btn" class="w-full bg-white text-gray-800 py-2.5 border border-gray-300 rounded-md hover:bg-gray-50 transition font-medium">Opret bruger</button>
            </form>
        </div>
    </div>

    <!-- App Container (Hidden until logged in) -->
    <div id="app-container" class="w-full h-full flex hidden relative">
        
        <!-- Mobile Sidebar Backdrop -->
        <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

        <!-- Sidebar -->
        <div id="sidebar" class="bg-[#f7f7f5] border-r border-gray-200 flex-col h-full flex-shrink-0 shadow-xl md:shadow-none">
            <!-- Sidebar Header -->
            <div class="p-4 flex items-center justify-between hover:bg-gray-200/50 cursor-pointer transition" id="user-profile-btn">
                <div class="flex items-center space-x-2 overflow-hidden">
                    <div class="w-6 h-6 bg-gray-300 rounded flex items-center justify-center text-xs font-bold text-gray-700 flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="user-email-display" class="text-sm font-medium truncate">Bruger</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-chevron-down text-xs text-gray-500"></i>
                    <button type="button" onclick="event.stopPropagation(); toggleSidebar(false)" class="text-gray-500 hover:text-gray-800 p-1" title="Luk menu">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Log out dropdown (hidden) -->
            <div id="logout-menu" class="hidden mx-4 mb-4 bg-white border border-gray-200 rounded shadow-sm">
                <button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50">Log ud</button>
            </div>

            <!-- Navigation -->
            <div class="flex-1 overflow-y-auto py-2">
                <div class="px-3 mb-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Oversigt</div>
                
                <div id="sidebar-root-btn" class="flex items-center space-x-2 px-4 py-2 cursor-pointer hover:bg-gray-200/50 text-sm font-medium">
                    <i class="fa-solid fa-house text-gray-500 w-4 text-center"></i>
                    <span>Alle noter (Hjem)</span>
                </div>

                <div class="mt-4 px-3 mb-1 flex items-center justify-between group">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Dine Mapper</span>
                    <button onclick="createNewFolder()" class="text-gray-500 hover:text-gray-800 md:opacity-0 md:group-hover:opacity-100 transition p-1" title="Ny mappe">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
                
                <!-- Folders List -->
                <div id="sidebar-folders" class="space-y-0.5">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-white min-w-0">
            
            <!-- Topbar / Breadcrumbs -->
            <div class="h-14 border-b border-gray-100 flex items-center px-3 sm:px-6 justify-between flex-shrink-0 gap-2">
                <div class="flex items-center space-x-2 min-w-0 flex-1">
                    <button onclick="toggleSidebar()" class="text-gray-600 hover:text-gray-900 p-2 -ml-1 rounded-md hover:bg-gray-100 flex-shrink-0" aria-label="Menu">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="flex items-center space-x-1 sm:space-x-2 text-sm text-gray-600 overflow-x-auto whitespace-nowrap no-scrollbar" id="breadcrumbs">
                        <!-- Populated by JS -->
                        <span class="cursor-pointer hover:underline">Hjem</span>
                    </div>
                </div>
                <div class="flex space-x-1.5 sm:space-x-2 flex-shrink-0">
                    <button onclick="createNewFolder()" class="text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 px-2.5 sm:px-3 py-1.5 rounded-md transition flex items-center" title="Ny Mappe">
                        <i class="fa-solid fa-folder-plus sm:mr-1.5"></i>
                        <span class="hidden sm:inline">Ny Mappe</span>
                    </button>
                    <button onclick="createNewPrompt()" class="text-sm bg-blue-600 text-white hover:bg-blue-700 px-3 py-1.5 rounded-md transition font-medium flex items-center shadow-sm">
                        <i class="fa-solid fa-plus mr-1.5"></i>
                        <span>Ny Note</span>
                    </button>
                </div>
            </div>

            <!-- Explorer Content -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-8 lg:px-24">
                <h1 id="current-folder-title" class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 break-words">Hjem</h1>
                
                <!-- Folders Grid -->
                <div class="mb-6 sm:mb-8">
                    <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 border-b pb-1 hidden" id="folders-header">Mapper</h2>
                    <div id="folders-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Notes List -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 border-b pb-1 hidden" id="prompts-header">Noter</h2>
                    <div id="prompts-list" class="flex flex-col divide-y divide-gray-100">
                        <!-- Populated by JS -->
                    </div>
                </div>
                
                <div id="empty-state" class="hidden text-center py-16 text-gray-400">
                    <i class="fa-regular fa-note-sticky text-4xl mb-3"></i>
                    <p>Ingen noter i denne mappe endnu.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Note Editor Overlay (Modal) -->
    <div id="editor-modal" class="fixed inset-0 z-[100] modal-backdrop flex justify-center items-start hidden overflow-y-auto sm:pt-12 sm:pb-12">
        <div class="bg-white w-full max-w-3xl sm:rounded-xl shadow-2xl flex flex-col relative min-h-[100dvh] sm:min-h-[65vh] sm:my-auto">
            
            <!-- Top Bar inside Editor -->
            <div class="flex items-center justify-between px-4 py-3 sm:px-10 sm:pt-6 sm:pb-2 border-b sm:border-b-0 border-gray-100">
                <!-- Folder Selector (makes moving notes easy on mobile) -->
                <div class="flex items-center space-x-2 text-xs sm:text-sm text-gray-500 min-w-0">
                    <i class="fa-regular fa-folder text-gray-400"></i>
                    <select id="note-folder-select" class="bg-gray-50 border border-gray-200 text-gray-700 rounded-md px-2 py-1 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-[180px] sm:max-w-xs truncate">
                        <option value="">Hjem (Rod)</option>
                    </select>
                    <span id="save-status" class="text-xs text-gray-400 hidden sm:inline"></span>
                </div>

                <!-- Controls -->
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <button onclick="copyPromptText()" class="text-gray-500 hover:text-gray-800 p-2 rounded-md hover:bg-gray-100 transition relative" title="Kopier tekst">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copy-tooltip" class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded hidden whitespace-nowrap z-20">Kopieret!</span>
                    </button>
                    <button onclick="closeEditorModal()" class="text-gray-600 hover:text-gray-900 px-3 py-1.5 sm:p-2 rounded-md bg-gray-100 sm:bg-transparent hover:bg-gray-200 sm:hover:bg-gray-100 transition text-sm font-medium flex items-center" title="Luk og gem">
                        <span class="sm:hidden mr-1.5">Færdig</span>
                        <i class="fa-solid fa-xmark text-base sm:text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Editor Content -->
            <div class="p-4 sm:px-10 sm:pb-10 sm:pt-4 flex-1 flex flex-col">
                <input type="text" id="prompt-title-input" class="text-2xl sm:text-4xl font-bold w-full outline-none placeholder-gray-300 mb-4 sm:mb-6" placeholder="Navnløs note">
                <div id="quill-editor-container" class="flex-1"></div>
            </div>
        </div>
    </div>

    <!-- Mappe Modal (Opret / Omdøb) -->
    <div id="folder-modal" class="fixed inset-0 z-[110] modal-backdrop flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl border border-gray-200 p-6 w-96 max-w-full">
            <h3 id="folder-modal-title" class="text-lg font-bold text-gray-800 mb-3">Ny Mappe</h3>
            <input type="text" id="folder-modal-input" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Mappens navn...">
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="closeFolderModal()" class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition">Annuller</button>
                <button type="button" id="folder-modal-submit" class="px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-lg transition">Gem</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // User provided configuration with verified API key
        const firebaseConfig = {
            apiKey: "AIzaSyCqEJ5yRtTB1KjAG0RmnEsDNiXFJBKwUxo",
            authDomain: "tempco2fugt.firebaseapp.com",
            databaseURL: "https://tempco2fugt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tempco2fugt",
            storageBucket: "tempco2fugt.firebasestorage.app",
            messagingSenderId: "1068932962336",
            appId: "1:1068932962336:web:7e4e98e816f2ed515a4445",
            measurementId: "G-9CN2V79CVX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State (bevarer appId og Firestore-stier så eksisterende data bevares)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'prompt-library-app';
        let currentUser = null;
        let allFolders = [];
        let allPrompts = [];
        let currentFolderId = null; // null means root
        let currentEditingPromptId = null;
        let saveTimeout = null;
        
        let folderUnsubscribe = null;
        let promptUnsubscribe = null;

        // Drag & Drop State
        let draggedItem = null; // { type: 'prompt' | 'folder', id: string }
        let folderModalMode = 'create'; // 'create' | 'rename'
        let folderModalTargetId = null;

        const isTouchDevice = () => window.matchMedia('(pointer: coarse)').matches;

        // Initialize Quill Editor
        const quill = new Quill('#quill-editor-container', {
            theme: 'snow',
            placeholder: 'Skriv din note her...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['blockquote', 'code-block'],
                    ['clean']
                ]
            }
        });

        // DOM Elements
        const authScreen = document.getElementById('auth-screen');
        const appContainer = document.getElementById('app-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        const authForm = document.getElementById('auth-form');
        
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const foldersGrid = document.getElementById('folders-grid');
        const promptsList = document.getElementById('prompts-list');
        const sidebarFolders = document.getElementById('sidebar-folders');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const currentFolderTitle = document.getElementById('current-folder-title');
        const foldersHeader = document.getElementById('folders-header');
        const promptsHeader = document.getElementById('prompts-header');
        const emptyState = document.getElementById('empty-state');
        
        const editorModal = document.getElementById('editor-modal');
        const promptTitleInput = document.getElementById('prompt-title-input');
        const noteFolderSelect = document.getElementById('note-folder-select');
        const saveStatus = document.getElementById('save-status');

        const folderModal = document.getElementById('folder-modal');
        const folderModalTitle = document.getElementById('folder-modal-title');
        const folderModalInput = document.getElementById('folder-modal-input');
        const folderModalSubmit = document.getElementById('folder-modal-submit');

        // Sidebar Toggle (works on both mobile/touch and desktop)
        window.toggleSidebar = function(show) {
            const isDesktopMouse = window.matchMedia('(min-width: 768px) and (pointer: fine)').matches;
            if (isDesktopMouse) {
                const isClosed = sidebar.classList.contains('sidebar-closed-desktop');
                const shouldShow = typeof show === 'boolean' ? show : isClosed;
                sidebar.classList.toggle('sidebar-closed-desktop', !shouldShow);
                sidebar.classList.remove('sidebar-open');
                sidebarBackdrop.classList.add('hidden');
            } else {
                const isOpen = sidebar.classList.contains('sidebar-open');
                const shouldShow = typeof show === 'boolean' ? show : !isOpen;
                sidebar.classList.toggle('sidebar-open', shouldShow);
                sidebarBackdrop.classList.toggle('hidden', !shouldShow);
            }
        };

        // Authentication Event Listeners
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                authError.innerText = "Indtast venligst både e-mail og adgangskode.";
                authError.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Login fejl:", error);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    authError.innerText = "Forkert e-mail eller adgangskode.";
                } else if (error.code === 'auth/invalid-email') {
                    authError.innerText = "Ugyldigt e-mail format.";
                } else {
                    authError.innerText = `Fejl: ${error.message}`;
                }
                authError.classList.remove('hidden');
            }
        });

        document.getElementById('register-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                authError.innerText = "Indtast venligst både e-mail og adgangskode.";
                authError.classList.remove('hidden');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Oprettelsesfejl:", error);
                if (error.code === 'auth/email-already-in-use') {
                    authError.innerText = "Denne e-mail er allerede i brug.";
                } else if (error.code === 'auth/weak-password') {
                    authError.innerText = "Adgangskoden skal være på mindst 6 tegn.";
                } else {
                    authError.innerText = `Fejl: ${error.message}`;
                }
                authError.classList.remove('hidden');
            }
        });

        document.getElementById('user-profile-btn').addEventListener('click', () => {
            document.getElementById('logout-menu').classList.toggle('hidden');
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
            document.getElementById('logout-menu').classList.add('hidden');
        });

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-email-display').innerText = user.email.split('@')[0];
                authScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                initDataSubscriptions();
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
                cleanupSubscriptions();
            }
        });

        // Data Paths (Following strict platform rules)
        const getFoldersRef = () => collection(db, 'artifacts', appId, 'users', currentUser.uid, 'folders');
        const getPromptsRef = () => collection(db, 'artifacts', appId, 'users', currentUser.uid, 'prompts');

        function initDataSubscriptions() {
            if (!currentUser) return;

            folderUnsubscribe = onSnapshot(getFoldersRef(), (snapshot) => {
                allFolders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp();
            }, (error) => console.error("Folders subscription error:", error));

            promptUnsubscribe = onSnapshot(getPromptsRef(), (snapshot) => {
                allPrompts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp();
            }, (error) => console.error("Notes subscription error:", error));
        }

        function cleanupSubscriptions() {
            if (folderUnsubscribe) folderUnsubscribe();
            if (promptUnsubscribe) promptUnsubscribe();
            allFolders = [];
            allPrompts = [];
            currentFolderId = null;
        }

        // UI Rendering Logic
        function renderApp() {
            renderSidebar();
            renderMainContent();
            renderBreadcrumbs();
            populateFolderSelect();
        }

        function populateFolderSelect() {
            if (!noteFolderSelect) return;
            const currentVal = noteFolderSelect.value;
            noteFolderSelect.innerHTML = '<option value="">Hjem (Rod)</option>';
            const sortedFolders = [...allFolders].sort((a, b) => a.name.localeCompare(b.name));
            sortedFolders.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = f.name;
                noteFolderSelect.appendChild(opt);
            });
            if (currentEditingPromptId) {
                const note = allPrompts.find(p => p.id === currentEditingPromptId);
                if (note) noteFolderSelect.value = note.folderId || '';
            } else {
                noteFolderSelect.value = currentVal;
            }
        }

        function renderSidebar() {
            sidebarFolders.innerHTML = '';
            
            const sortedFolders = [...allFolders].sort((a, b) => a.name.localeCompare(b.name));
            const touch = isTouchDevice();
            
            sortedFolders.forEach(folder => {
                const isActive = folder.id === currentFolderId;
                const div = document.createElement('div');
                div.className = `flex items-center space-x-2 px-4 py-2 cursor-pointer text-sm item-hover transition rounded-md mx-2 ${isActive ? 'bg-gray-200/60 font-medium' : 'hover:bg-gray-100 text-gray-600'}`;
                
                if (!touch) {
                    div.setAttribute('draggable', 'true');
                    div.ondragstart = (e) => handleDragStart(e, 'folder', folder.id);
                    div.ondragover = (e) => handleDragOver(e);
                    div.ondragleave = (e) => handleDragLeave(e);
                    div.ondrop = (e) => handleDrop(e, folder.id);
                }

                div.innerHTML = `
                    <i class="fa-solid fa-folder text-gray-400 w-4 text-center pointer-events-none"></i>
                    <span class="flex-1 truncate pointer-events-none">${escapeHTML(folder.name)}</span>
                    <div class="item-actions flex items-center space-x-1">
                        <button class="text-gray-400 hover:text-blue-600 p-1" title="Omdøb mappe" onclick="openRenameFolderModal('${folder.id}', event)">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button class="text-gray-400 hover:text-red-500 p-1" title="Slet mappe" onclick="deleteFolder('${folder.id}', event)">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                
                div.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    navigateToFolder(folder.id);
                    sidebar.classList.remove('sidebar-open');
                    sidebarBackdrop.classList.add('hidden');
                };
                
                sidebarFolders.appendChild(div);
            });
            
            // Håndter Rod i sidebar som drop-zone
            const rootBtn = document.getElementById('sidebar-root-btn');
            rootBtn.className = `flex items-center space-x-2 px-4 py-2 cursor-pointer text-sm transition mx-2 rounded-md ${currentFolderId === null ? 'bg-gray-200/60 font-medium' : 'hover:bg-gray-100 text-gray-600'}`;
            if (!touch) {
                rootBtn.ondragover = (e) => handleDragOver(e);
                rootBtn.ondragleave = (e) => handleDragLeave(e);
                rootBtn.ondrop = (e) => handleDrop(e, null);
            }
            rootBtn.onclick = () => {
                navigateToFolder(null);
                sidebar.classList.remove('sidebar-open');
                sidebarBackdrop.classList.add('hidden');
            };
        }

        function renderMainContent() {
            const currentViewFolders = allFolders.filter(f => f.parentId === currentFolderId);
            const currentViewPrompts = allPrompts.filter(p => p.folderId === currentFolderId);
            const touch = isTouchDevice();

            // Update Title
            if (currentFolderId === null) {
                currentFolderTitle.innerText = "Alle noter";
            } else {
                const folder = allFolders.find(f => f.id === currentFolderId);
                currentFolderTitle.innerHTML = folder 
                    ? `<span class="group inline-flex items-center cursor-pointer" onclick="openRenameFolderModal('${folder.id}', event)">
                         ${escapeHTML(folder.name)}
                         <i class="fa-solid fa-pen text-xs ml-3 text-gray-400 group-hover:text-gray-600"></i>
                       </span>` 
                    : "Ukendt mappe";
            }

            // Render Folders Grid
            foldersGrid.innerHTML = '';
            if (currentViewFolders.length > 0) {
                foldersHeader.classList.remove('hidden');
                currentViewFolders.forEach(folder => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 active:bg-gray-100 transition group";
                    
                    if (!touch) {
                        div.setAttribute('draggable', 'true');
                        div.ondragstart = (e) => handleDragStart(e, 'folder', folder.id);
                        div.ondragover = (e) => handleDragOver(e);
                        div.ondragleave = (e) => handleDragLeave(e);
                        div.ondrop = (e) => handleDrop(e, folder.id);
                    }

                    div.innerHTML = `
                        <div class="flex items-center space-x-3 flex-1 min-w-0 pointer-events-none">
                            <i class="fa-solid fa-folder text-blue-400 text-xl flex-shrink-0"></i>
                            <span class="font-medium text-sm truncate">${escapeHTML(folder.name)}</span>
                        </div>
                        <div class="opacity-100 md:opacity-0 md:group-hover:opacity-100 flex items-center space-x-1 pl-2">
                            <button onclick="openRenameFolderModal('${folder.id}', event)" class="p-1.5 text-gray-400 hover:text-blue-600 rounded transition" title="Omdøb">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteFolder('${folder.id}', event)" class="p-1.5 text-gray-400 hover:text-red-500 rounded transition" title="Slet">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    `;
                    div.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        navigateToFolder(folder.id);
                    };
                    foldersGrid.appendChild(div);
                });
            } else {
                foldersHeader.classList.add('hidden');
            }

            // Render Notes List
            promptsList.innerHTML = '';
            if (currentViewPrompts.length > 0) {
                promptsHeader.classList.remove('hidden');
                currentViewPrompts.forEach(prompt => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between py-3 px-2 sm:px-3 hover:bg-gray-50 active:bg-gray-100 cursor-pointer group rounded transition";
                    
                    if (!touch) {
                        div.setAttribute('draggable', 'true');
                        div.ondragstart = (e) => handleDragStart(e, 'prompt', prompt.id);
                    }

                    // Simple preview extraction from HTML
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = prompt.content || '';
                    const textContent = tempDiv.textContent || tempDiv.innerText || '';
                    const previewText = textContent.length > 80 ? textContent.substring(0, 80) + '...' : textContent;

                    div.innerHTML = `
                        <div class="flex items-center space-x-3 flex-1 min-w-0" onclick="openPromptEditor('${prompt.id}')">
                            <i class="fa-solid fa-grip-vertical text-gray-300 cursor-grab group-hover:text-gray-400 text-sm hidden md:inline"></i>
                            <i class="fa-regular fa-note-sticky text-gray-400 text-lg w-5 text-center flex-shrink-0"></i>
                            <div class="flex-1 min-w-0">
                                <div class="font-medium text-sm text-gray-800 truncate">${escapeHTML(prompt.title) || 'Navnløs note'}</div>
                                <div class="text-xs text-gray-400 truncate">${escapeHTML(previewText) || 'Tom note...'}</div>
                            </div>
                        </div>
                        <button onclick="deletePrompt('${prompt.id}', event)" class="opacity-100 md:opacity-0 md:group-hover:opacity-100 text-gray-400 hover:text-red-500 p-2 transition flex-shrink-0" title="Slet note">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    `;
                    promptsList.appendChild(div);
                });
            } else {
                promptsHeader.classList.add('hidden');
            }

            // Empty State
            if (currentViewFolders.length === 0 && currentViewPrompts.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        function renderBreadcrumbs() {
            breadcrumbs.innerHTML = '';

            const homeSpan = document.createElement('span');
            homeSpan.className = "cursor-pointer hover:underline text-gray-500 px-1 py-0.5 rounded";
            homeSpan.innerText = "Hjem";
            homeSpan.onclick = () => navigateToFolder(null);
            
            homeSpan.ondragover = (e) => handleDragOver(e);
            homeSpan.ondragleave = (e) => handleDragLeave(e);
            homeSpan.ondrop = (e) => handleDrop(e, null);

            breadcrumbs.appendChild(homeSpan);
            
            if (currentFolderId !== null) {
                const trail = [];
                let currId = currentFolderId;
                while (currId) {
                    const f = allFolders.find(item => item.id === currId);
                    if (f) {
                        trail.unshift(f);
                        currId = f.parentId;
                    } else {
                        break;
                    }
                }

                trail.forEach((folder, index) => {
                    const separator = document.createElement('span');
                    separator.className = "text-gray-400";
                    separator.innerText = "/";
                    breadcrumbs.appendChild(separator);

                    const folderSpan = document.createElement('span');
                    const isLast = index === trail.length - 1;
                    folderSpan.className = isLast 
                        ? "font-medium text-gray-800 px-1 py-0.5 rounded truncate max-w-[140px] sm:max-w-none" 
                        : "cursor-pointer hover:underline text-gray-600 px-1 py-0.5 rounded truncate max-w-[100px] sm:max-w-none";
                    folderSpan.innerText = folder.name;
                    folderSpan.onclick = () => navigateToFolder(folder.id);

                    folderSpan.ondragover = (e) => handleDragOver(e);
                    folderSpan.ondragleave = (e) => handleDragLeave(e);
                    folderSpan.ondrop = (e) => handleDrop(e, folder.id);

                    breadcrumbs.appendChild(folderSpan);
                });
            }
        }

        // --- Drag & Drop Håndtering ---
        function handleDragStart(e, type, id) {
            draggedItem = { type, id };
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id);
            if (e.target) {
                e.target.classList.add('opacity-40');
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'move';
            const dropTarget = e.currentTarget;
            if (dropTarget) {
                dropTarget.classList.add('bg-blue-50', 'ring-2', 'ring-blue-400');
            }
        }

        function handleDragLeave(e) {
            e.stopPropagation();
            const dropTarget = e.currentTarget;
            if (dropTarget) {
                dropTarget.classList.remove('bg-blue-50', 'ring-2', 'ring-blue-400');
            }
        }

        async function handleDrop(e, targetFolderId) {
            e.preventDefault();
            e.stopPropagation();
            const dropTarget = e.currentTarget;
            if (dropTarget) {
                dropTarget.classList.remove('bg-blue-50', 'ring-2', 'ring-blue-400');
            }

            if (!draggedItem || !currentUser) return;

            const { type, id } = draggedItem;

            if (type === 'prompt') {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'prompts', id), {
                        folderId: targetFolderId,
                        updatedAt: serverTimestamp()
                    });
                } catch (err) {
                    console.error("Fejl ved flytning af note:", err);
                }
            } else if (type === 'folder') {
                if (id === targetFolderId || isDescendantOf(targetFolderId, id)) {
                    draggedItem = null;
                    return;
                }

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'folders', id), {
                        parentId: targetFolderId
                    });
                } catch (err) {
                    console.error("Fejl ved flytning af mappe:", err);
                }
            }

            draggedItem = null;
            document.querySelectorAll('.opacity-40').forEach(el => el.classList.remove('opacity-40'));
        }

        function isDescendantOf(targetFolderId, parentCandidateId) {
            if (!targetFolderId) return false;
            let current = allFolders.find(f => f.id === targetFolderId);
            while (current && current.parentId) {
                if (current.parentId === parentCandidateId) return true;
                current = allFolders.find(f => f.id === current.parentId);
            }
            return false;
        }

        document.addEventListener('dragend', () => {
            document.querySelectorAll('.opacity-40').forEach(el => el.classList.remove('opacity-40'));
            draggedItem = null;
        });

        // Navigation Actions
        window.navigateToFolder = function(folderId) {
            currentFolderId = folderId;
            renderApp();
        };

        // --- Mappe Modaler (Opret & Omdøb) ---
        window.createNewFolder = function() {
            folderModalMode = 'create';
            folderModalTargetId = null;
            folderModalTitle.innerText = "Opret ny mappe";
            folderModalInput.value = '';
            folderModal.classList.remove('hidden');
            folderModalInput.focus();
        };

        window.openRenameFolderModal = function(folderId, event) {
            if (event) event.stopPropagation();
            const folder = allFolders.find(f => f.id === folderId);
            if (!folder) return;

            folderModalMode = 'rename';
            folderModalTargetId = folderId;
            folderModalTitle.innerText = "Omdøb mappe";
            folderModalInput.value = folder.name || '';
            folderModal.classList.remove('hidden');
            folderModalInput.focus();
            folderModalInput.select();
        };

        window.closeFolderModal = function() {
            folderModal.classList.add('hidden');
            folderModalInput.value = '';
            folderModalTargetId = null;
        };

        folderModalSubmit.addEventListener('click', async () => {
            if (!currentUser) return;
            const name = folderModalInput.value.trim();
            if (!name) return;

            if (folderModalMode === 'create') {
                try {
                    await addDoc(getFoldersRef(), {
                        name: name,
                        parentId: currentFolderId,
                        createdAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Fejl ved oprettelse af mappe:", error);
                }
            } else if (folderModalMode === 'rename' && folderModalTargetId) {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'folders', folderModalTargetId), {
                        name: name
                    });
                } catch (error) {
                    console.error("Fejl ved omdøbning af mappe:", error);
                }
            }

            closeFolderModal();
        });

        folderModalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                folderModalSubmit.click();
            } else if (e.key === 'Escape') {
                closeFolderModal();
            }
        });

        window.createNewPrompt = async function() {
            if (!currentUser) return;
            try {
                const newPromptRef = await addDoc(getPromptsRef(), {
                    title: '',
                    content: '',
                    folderId: currentFolderId,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                openPromptEditor(newPromptRef.id);
            } catch (error) {
                console.error("Fejl ved oprettelse af note:", error);
            }
        };

        // Delete Operations
        window.deleteFolder = async function(folderId, event) {
            event.stopPropagation();
            if (!currentUser) return;
            
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'folders', folderId));
                if (currentFolderId === folderId) {
                    navigateToFolder(null);
                }
            } catch (error) {
                console.error("Fejl ved sletning af mappe:", error);
            }
        };

        window.deletePrompt = async function(promptId, event) {
            event.stopPropagation();
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'prompts', promptId));
            } catch (error) {
                console.error("Fejl ved sletning af note:", error);
            }
        };

        // Editor Actions & Auto-save
        async function saveCurrentNote() {
            if (!currentUser || !currentEditingPromptId) return;
            const title = promptTitleInput.value.trim();
            const content = quill.root.innerHTML;
            const selectedFolderId = noteFolderSelect.value || null;

            try {
                if (saveStatus) saveStatus.innerText = "Gemmer...";
                await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'prompts', currentEditingPromptId), {
                    title: title,
                    content: content,
                    folderId: selectedFolderId,
                    updatedAt: serverTimestamp()
                });
                if (saveStatus) saveStatus.innerText = "Gemt";
            } catch (error) {
                console.error("Fejl ved gemning af note:", error);
                if (saveStatus) saveStatus.innerText = "Fejl ved gemning";
            }
        }

        function scheduleAutoSave() {
            if (!currentEditingPromptId) return;
            if (saveStatus) saveStatus.innerText = "...";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCurrentNote, 800);
        }

        promptTitleInput.addEventListener('input', scheduleAutoSave);
        quill.on('text-change', (_delta, _oldDelta, source) => {
            if (source === 'user') scheduleAutoSave();
        });
        noteFolderSelect.addEventListener('change', saveCurrentNote);

        // Save if user switches app or locks phone on mobile
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && currentEditingPromptId) {
                clearTimeout(saveTimeout);
                saveCurrentNote();
            }
        });

        window.openPromptEditor = function(promptId) {
            const promptDoc = allPrompts.find(p => p.id === promptId);
            if (!promptDoc) return;

            currentEditingPromptId = promptId;
            promptTitleInput.value = promptDoc.title || '';
            if (saveStatus) saveStatus.innerText = "";
            populateFolderSelect();
            noteFolderSelect.value = promptDoc.folderId || '';
            
            quill.clipboard.dangerouslyPasteHTML(promptDoc.content || '');

            editorModal.classList.remove('hidden');
            
            if (!promptDoc.title) {
                promptTitleInput.focus();
            }
        };

        window.closeEditorModal = async function() {
            if (!currentUser || !currentEditingPromptId) return;

            clearTimeout(saveTimeout);
            await saveCurrentNote();

            currentEditingPromptId = null;
            editorModal.classList.add('hidden');
        };

        // Click outside to close modal
        editorModal.addEventListener('click', (e) => {
            if (e.target === editorModal) {
                closeEditorModal();
            }
        });

        // Handle Escape key to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !editorModal.classList.contains('hidden')) {
                closeEditorModal();
            }
        });

        window.copyPromptText = async function() {
            const textToCopy = quill.getText();
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.prepend(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                }
                const tooltip = document.getElementById('copy-tooltip');
                tooltip.classList.remove('hidden');
                setTimeout(() => tooltip.classList.add('hidden'), 2000);
            } catch (error) {
                console.error("Kopiering fejlede", error);
            }
        };

        // Utility: HTML Escaping to prevent injection in UI renders
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

    </script>
</body>
</html>
